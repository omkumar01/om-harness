<!doctype html>
<!-- om-harness reference web client: single page, no build step. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>om-harness</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --text:#d7dae0; --dim:#8b93a1; --accent:#4f9cf9; --ok:#3fbf7f; --err:#e56565; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; background:var(--panel); border-bottom:1px solid #232833; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #status { color:var(--dim); font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:10px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:2px; }
  .assistant { align-self:flex-start; background:var(--panel); border:1px solid #232833; border-bottom-left-radius:2px; }
  .event { align-self:flex-start; color:var(--dim); font-size:12px; font-family:ui-monospace,monospace; }
  .event.err { color:var(--err); } .event.ok { color:var(--ok); }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--panel); border-top:1px solid #232833; }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #2a3040; background:#0d0f13; color:var(--text); }
  button { padding:10px 18px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>om-harness</h1>
  <div id="status">loading…</div>
</header>
<div id="log"></div>
<form id="composer">
  <input id="text" placeholder="Ask about this repository, or request a change…" autocomplete="off">
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
let sessionId = null;

function add(kind, cls) {
  const el = document.createElement('div');
  el.className = kind + (cls ? ' ' + cls : '');
  el.textContent = typeof arguments[1] === 'string' || !cls ? cls : '';
  return el;
}
function addMsg(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function addEvent(text, cls) {
  const el = document.createElement('div');
  el.className = 'event' + (cls ? ' ' + cls : '');
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

fetch('/api/status').then(r => r.json()).then(s => {
  statusEl.textContent = s.repo_root + ' · model ' + s.default_model + ' · approval ' + s.approval_policy;
});

document.getElementById('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('text');
  const button = document.getElementById('send');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);
  button.disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session_id: sessionId}),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    sessionId = data.session_id;
    for (const ev of data.events) addEvent(ev.icon + ' ' + ev.text, ev.level === 'error' ? 'err' : ev.level === 'success' ? 'ok' : '');
    addMsg('assistant', data.reply);
  } catch (err) {
    addEvent('request failed: ' + err.message, 'err');
  } finally {
    button.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
