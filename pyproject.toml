[project]
name = "om-harness"
version = "1.0.0"
description = "A context-efficient AI coding-agent harness: orchestration, tools, and durable state for real repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "om-harness contributors" }]
keywords = ["ai", "agent", "coding-agent", "llm", "pydantic-ai", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai,anthropic,google]>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.30"]

[project.scripts]
om-harness = "om_harness.cli.app:run_app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/om_harness"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/om_harness/ui/*" = ["RUF001"]  # box-drawing/❯ glyphs are intentional

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["pydantic_ai.*", "pydantic_ai_slim.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: tests that require real provider credentials (deselected by default)",
]

[tool.coverage.run]
source = ["src/om_harness"]
omit = ["*/ui/web/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
